# Lokale Entwicklung: make up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: teamtafel
      POSTGRES_USER: teamtafel
      POSTGRES_PASSWORD: teamtafel
      APP_DB_PASSWORD: teamtafel_app
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtafel -d teamtafel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VERSION: dev
    environment:
      DATABASE_URL: postgres://teamtafel_app:teamtafel_app@db:5432/teamtafel?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://teamtafel:teamtafel@db:5432/teamtafel?sslmode=disable
      APP_HOST: localhost
      APP_SCHEME: http
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
