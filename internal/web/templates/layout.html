{{define "kopf"}}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Titel}}{{.Titel}} · {{end}}Teamtafel</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem 1rem; background: #f6f7f9; color: #1d2330; }
    main { max-width: 32rem; margin: 0 auto; }
    h1 { margin: 0 0 .5rem; }
    .leise { color: #5b6475; font-size: .875rem; }
    .fehler { color: #b42318; }
    input[type=email], input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1rem; border: 1px solid #c5cad3; border-radius: .4rem; }
    button { margin-top: .75rem; padding: .6rem 1rem; font-size: 1rem; border: 0; border-radius: .4rem; background: #1f6feb; color: #fff; }
    button.leise { background: none; color: inherit; padding: 0; text-decoration: underline; }
    form.inline { display: inline; }
    label { display: block; margin-top: .75rem; }
    label.wahl { display: flex; gap: .5rem; align-items: center; }
    .karte { background: rgba(127,127,127,.08); border-radius: .5rem; padding: .75rem 1rem; margin: .75rem 0; }
    button.zweit { background: #5b6475; }
    .qr { width: 16rem; max-width: 100%; display: block; margin: 1rem 0; }
    a.termin { display: block; color: inherit; text-decoration: none; padding: .6rem .8rem; margin: .4rem 0; border-radius: .5rem; background: rgba(127,127,127,.08); }
    a.termin .wann { display: block; font-weight: 600; }
    a.termin.abgesagt span { text-decoration: line-through; }
    input[type=date], input[type=time], input[type=datetime-local], select { padding: .5rem; font-size: 1rem; border: 1px solid #c5cad3; border-radius: .4rem; }
    .zeile { display: flex; gap: .75rem; flex-wrap: wrap; }
    .zeile > div { flex: 1 1 7rem; }
    .zeile input, .zeile select { width: 100%; box-sizing: border-box; }
    details summary { cursor: pointer; font-weight: 600; margin: 1rem 0 .5rem; }
    .link { word-break: break-all; font-family: ui-monospace, monospace; font-size: .875rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #12151b; color: #e6e9ef; }
      .leise { color: #9aa3b5; }
      input[type=email], input[type=text], input[type=number], input[type=date], input[type=time], input[type=datetime-local], select { background: #1b1f27; color: inherit; border-color: #39404d; }
    }
  </style>
</head>
<body>
  <main>
{{end}}

{{define "terminzeile"}}
    <a class="termin{{if .Abgesagt}} abgesagt{{end}}" href="/t/{{.ID}}">
      <span class="wann">{{datum .Beginn}}, {{uhrzeit .Beginn}}</span>
      <span>{{typName .Typ}}{{if .Titel}} {{.Titel}}{{end}} <span class="leise">{{.Mannschaft}}{{if .Ort}} · {{.Ort}}{{end}}</span></span>
      {{- if .Abgesagt}} <strong class="fehler">Abgesagt</strong>{{end}}
    </a>
{{end}}

{{define "fuss"}}
  </main>
</body>
</html>
{{end}}
