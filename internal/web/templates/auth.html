{{template "kopf" .}}
  <header class="kopf">
    <div class="kopf-innen">
      <h1>Anmelden</h1>
    </div>
  </header>
  <main>
    <form class="karte" method="post" action="/auth/{{.Token}}">
      <input type="hidden" name="weiter" value="{{.Weiter}}">
      <p>Tippe auf den Knopf, um dich auf diesem Gerät anzumelden.</p>
      <button>Jetzt anmelden</button>
    </form>
  </main>
{{template "fuss" .}}
